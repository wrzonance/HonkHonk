name: DEB Package

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

# Read-only by default; a job that needs more declares it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build .deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the package to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libpipewire-0.3-dev libwayland-dev pkg-config lintian imagemagick

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-deny + cargo-deb
        run: |
          cargo install cargo-deny --version 0.19.4 --locked
          cargo install cargo-deb --version 3.7.0 --locked

      - name: Audit dependencies
        run: cargo deny check

      - name: Validate packaging prerequisites
        run: bash tests/packaging/deb_validate.sh

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build .deb
        run: cargo deb --target x86_64-unknown-linux-gnu --no-build

      - name: Lint .deb with lintian
        run: |
          DEB=$(ls target/x86_64-unknown-linux-gnu/debian/honkhonk_*.deb | head -1)
          echo "Package: $DEB"
          lintian --suppress-tags no-upstream-changelog,no-manual-page "$DEB" || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: honkhonk-deb-${{ github.ref_name }}
          path: target/x86_64-unknown-linux-gnu/debian/honkhonk_*.deb

      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG_NAME" >/dev/null 2>&1 && break
            echo "Waiting for release to be created... ($i/30)"
            sleep 10
          done
          gh release view "$TAG_NAME" >/dev/null 2>&1 || { echo "Release not found after 5 minutes"; exit 1; }
          DEB=$(ls target/x86_64-unknown-linux-gnu/debian/honkhonk_*.deb | head -1)
          gh release upload "$TAG_NAME" "$DEB" --clobber
